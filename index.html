<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRAME — Creator Studio</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_REELS = [
      {
        id: 'reel-1',
        title: 'The 10-minute creative reset',
        format: 'Reel',
        reach: 2450,
        plays: 3120,
        durationSec: 24,
        avgWatchSec: 19.8,
        retentionRate: 82.5,
        hookHold3s: 91.2,
        completionRate: 68.4,
        loopRate: 26.5,
        engagement: 9.2,
        saves: 142,
        followersGained: 28,
        color: 'var(--coral)',
        letter: 'R',
        driveLink: 'https://drive.google.com/file/d/1A2B3C4D5E6F7G8H9I0J/view',
        curve: [100, 95, 91, 88, 86, 84, 82, 79, 76, 73, 70, 68]
      }
    ];

    const SAMPLE_FOLLOWER_HANDLES = [
      { handle: '@aarav.visuals', name: 'Aarav Mehta', source: 'Reel: The 10-minute creative reset', niche: 'Filmmaker' },
      { handle: '@maya.designlab', name: 'Maya Lin', source: 'Reel: Behind the grading process', niche: 'Art Director' },
      { handle: '@kabir.edits', name: 'Kabir Sharma', source: 'Explore Page · Audio Trend', niche: 'Video Editor' },
      { handle: '@sana.studio', name: 'Sana Kapoor', source: 'Carousel: Less noise. Better work.', niche: 'Creator' },
      { handle: '@dev.motion', name: 'Dev Patel', source: 'Reel Share via DM', niche: '3D Artist' }
    ];

    function extractDriveFileId(url) {
      if (!url) return null;
      const patterns = [/\/file\/d\/([a-zA-Z0-9_-]+)/, /id=([a-zA-Z0-9_-]+)/, /\/d\/([a-zA-Z0-9_-]+)/];
      for (const regex of patterns) {
        const match = url.match(regex);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function extractInstagramReelId(url) {
      if (!url) return null;
      const match = url.match(/(?:instagram\.com|instagr\.am)\/(?:reel|reels|p|tv)\/([a-zA-Z0-9_-]+)/i);
      return match && match[1] ? match[1] : null;
    }

    function playFollowerChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.36);
      } catch {}
    }

    function readStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function App() {
      const [page, setPage] = useState('overview');
      const [platform, setPlatform] = useState('Instagram');
      const [range, setRange] = useState(30);
      const [toastMsg, setToastMsg] = useState('');
      const toastTimerRef = useRef(null);

      const [isAuthenticated, setIsAuthenticated] = useState(() => readStorage('frame_auth', false));
      const [igAccount, setIgAccount] = useState(() =>
        readStorage('frame_ig_account', {
          connected: false,
          handle: '@creator.frame',
          fullName: 'FRAME Creator Studio',
          followers: 100,
          liveStreamActive: false
        })
      );

      const [showIgModal, setShowIgModal] = useState(false);
      const [showAddReelModal, setShowAddReelModal] = useState(false);
      const [showFollowerDrawer, setShowFollowerDrawer] = useState(false);
      const [igLoginStep, setIgLoginStep] = useState('credentials');
      const [igUsernameInput, setIgUsernameInput] = useState('creator.frame');
      const [igPasswordInput, setIgPasswordInput] = useState('');
      const [showIgPassword, setShowIgPassword] = useState(false);
      const [igLoginError, setIgLoginError] = useState('');

      const [reels, setReels] = useState(() => readStorage('frame_reels', DEFAULT_REELS));
      const [selectedReelId, setSelectedReelId] = useState('reel-1');
      const [postFilter, setPostFilter] = useState('All formats');
      const [sortKey, setSortKey] = useState('watchHours');
      const [ascending, setAscending] = useState(false);

      const [followerEvents, setFollowerEvents] = useState(() =>
        readStorage('frame_followers', [
          { id: 'f-1', handle: '@maya.designlab', name: 'Maya Lin', source: 'Reel: The 10-minute creative reset', niche: 'Art Director', timestamp: '2 mins ago' },
          { id: 'f-2', handle: '@kabir.edits', name: 'Kabir Sharma', source: 'Reel: Behind the grading process', niche: 'Video Editor', timestamp: '14 mins ago' }
        ])
      );
      const [unreadFollowers, setUnreadFollowers] = useState(2);
      const [savedAnalyses, setSavedAnalyses] = useState(() => readStorage('frame_analyses', []));
      const [ideas, setIdeas] = useState(() =>
        readStorage('frame_ideas', [
          { id: 'idea-1', title: '3-second visual hook breakdown with Drive raw cut', date: '2026-11-20', status: 'Draft' },
          { id: 'idea-2', title: 'How watch time compounds after 75% retention', date: '2026-11-22', status: 'Scheduled' },
          { id: 'idea-3', title: 'The 10-minute creative reset (Reel)', date: '2026-11-14', status: 'Published' }
        ])
      );

      const [labFormat, setLabFormat] = useState('—');
      const [driveUrl, setDriveUrl] = useState('');
      const [reelTopic, setReelTopic] = useState('');
      const [caption, setCaption] = useState('');
      const [hashtags, setHashtags] = useState('');
      const [labFollowers, setLabFollowers] = useState(100);
      const [durationSec, setDurationSec] = useState(0);
      const [hookStyle, setHookStyle] = useState('1.15');
      const [cutPace, setCutPace] = useState('fast_2s');
      const [audioType, setAudioType] = useState('trending_original');
      const [imageSignal, setImageSignal] = useState(null);
      const [previewUrl, setPreviewUrl] = useState('');
      const [predictionResult, setPredictionResult] = useState(null);

      const [ideaTitle, setIdeaTitle] = useState('');
      const [ideaDate, setIdeaDate] = useState('2026-11-25');
      const [newReelLink, setNewReelLink] = useState('');
      const [customFollowerHandle, setCustomFollowerHandle] = useState('');
      const [customFollowerName, setCustomFollowerName] = useState('');
      const [customFollowerSourceReel, setCustomFollowerSourceReel] = useState('');

      useEffect(() => {
        try {
          localStorage.setItem('frame_auth', JSON.stringify(isAuthenticated));
          localStorage.setItem('frame_ig_account', JSON.stringify(igAccount));
          localStorage.setItem('frame_reels', JSON.stringify(reels));
          localStorage.setItem('frame_followers', JSON.stringify(followerEvents));
          localStorage.setItem('frame_analyses', JSON.stringify(savedAnalyses));
          localStorage.setItem('frame_ideas', JSON.stringify(ideas));
        } catch {}
      }, [isAuthenticated, igAccount, reels, followerEvents, savedAnalyses, ideas]);

      const showToast = (msg) => {
        setToastMsg(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToastMsg(''), 4200);
      };

      useEffect(() => {
        if (!igAccount.liveStreamActive) return;
        const interval = setInterval(() => triggerNewFollowerEvent(true), 11000);
        return () => clearInterval(interval);
      }, [igAccount.liveStreamActive, igAccount.followers]);

      const triggerNewFollowerEvent = (isAuto = false, customFollower = null) => {
        const topReelTitle = reels[0]?.title ? `Reel: ${reels[0].title}` : 'Reel: The 10-minute creative reset';
        const pick = customFollower || SAMPLE_FOLLOWER_HANDLES[Math.floor(Math.random() * SAMPLE_FOLLOWER_HANDLES.length)];
        const randomSuffix = Math.floor(10 + Math.random() * 89);
        const handle = customFollower?.handle
          ? (customFollower.handle.startsWith('@') ? customFollower.handle : `@${customFollower.handle}`)
          : isAuto ? `${pick.handle}_${randomSuffix}` : pick.handle;
        const newFollowersCount = (Number(igAccount.followers) || 100) + 1;
        const eventObj = {
          id: 'f-' + Date.now(),
          handle,
          name: pick.name || 'Instagram Creator',
          source: customFollower?.source || topReelTitle,
          niche: pick.niche || 'Creator',
          timestamp: 'Just now'
        };

        playFollowerChime();
        setUnreadFollowers((c) => c + 1);
        setIgAccount((prev) => ({ ...prev, followers: newFollowersCount }));
        setLabFollowers(newFollowersCount);
        setFollowerEvents((prev) => [eventObj, ...prev.slice(0, 29)]);
        setReels((prev) =>
          prev.map((r, idx) => (idx === 0 ? { ...r, followersGained: (Number(r.followersGained) || 0) + 1 } : r))
        );
        showToast(`New follower on ${igAccount.handle}: ${handle} via ${eventObj.source}`);
      };

      const handleCustomFollowerSubmit = (e) => {
        e.preventDefault();
        if (!customFollowerHandle.trim()) {
          showToast('Enter a follower handle to simulate a real-time webhook event.');
          return;
        }
        triggerNewFollowerEvent(false, {
          handle: customFollowerHandle.trim(),
          name: customFollowerName.trim() || 'New Instagram Follower',
          niche: 'Creator',
          source: customFollowerSourceReel || (reels[0] ? `Reel: ${reels[0].title}` : 'Instagram Reel')
        });
        setCustomFollowerHandle('');
        setCustomFollowerName('');
      };

      const handleAuthenticIgCredentialsSubmit = (e) => {
        e.preventDefault();
        setIgLoginError('');
        const cleanUser = igUsernameInput.trim().replace(/^@/, '');
        if (!cleanUser) {
          setIgLoginError('Please enter your Instagram phone number, username, or email.');
          return;
        }
        if (igPasswordInput.length < 4) {
          setIgLoginError('Please enter a password with at least 4 characters.');
          return;
        }
        setIgLoginStep('oauth_consent');
      };

      const handleConfirmOAuthConsent = () => {
        const cleanUser = igUsernameInput.trim().replace(/^@/, '') || 'creator.frame';
        setReels(DEFAULT_REELS);
        setSelectedReelId('reel-1');
        setIgAccount({ connected: true, handle: `@${cleanUser}`, fullName: `${cleanUser} Studio`, followers: 100, liveStreamActive: false });
        setLabFollowers(100);
        setIsAuthenticated(true);
        setShowIgModal(false);
        setIgLoginStep('credentials');
        showToast(`Logged in as @${cleanUser} (100 followers · 1 breakout Reel analyzed).`);
      };

      const platformFactor = platform === 'Instagram' ? 1 : platform === 'YouTube' ? 0.86 : 1.28;

      const enrichedReels = useMemo(() => {
        return reels.map((r) => {
          const plays = Math.round((Number(r.plays) || Number(r.reach) * 1.2) * platformFactor);
          const reach = Math.round((Number(r.reach) || 2450) * platformFactor);
          const avgWatchSec = Number(r.avgWatchSec) || (Number(r.durationSec || 24) * (Number(r.retentionRate || 82.5) / 100));
          const watchHours = +((plays * avgWatchSec) / 3600).toFixed(1);
          const retentionRate = +(Number(r.retentionRate) || ((avgWatchSec / (Number(r.durationSec) || 24)) * 100)).toFixed(1);
          return { ...r, plays, reach, avgWatchSec: +avgWatchSec.toFixed(1), watchHours, retentionRate };
        });
      }, [reels, platformFactor]);

      const kpiMetrics = useMemo(() => {
        const scale = range === 7 ? 0.85 : range === 30 ? 1 : 1.35;
        const totalReach = Math.round(enrichedReels.reduce((acc, r) => acc + r.reach, 0) * scale);
        const totalPlays = Math.round(enrichedReels.reduce((acc, r) => acc + r.plays, 0) * scale);
        const totalWatchHours = +(enrichedReels.reduce((acc, r) => acc + r.watchHours, 0) * scale).toFixed(1);
        const avgRetention = enrichedReels.length
          ? +(enrichedReels.reduce((acc, r) => acc + r.retentionRate, 0) / enrichedReels.length).toFixed(1)
          : 82.5;
        const avgHookHold = enrichedReels.length
          ? +(enrichedReels.reduce((acc, r) => acc + (Number(r.hookHold3s) || 91.2), 0) / enrichedReels.length).toFixed(1)
          : 91.2;
        const netFollowers = Math.round(enrichedReels.reduce((acc, r) => acc + (Number(r.followersGained) || 28), 0) * scale);
        return { totalReach, totalPlays, totalWatchHours, avgRetention, avgHookHold, netFollowers };
      }, [enrichedReels, range]);

      const selectedReel = useMemo(
        () => enrichedReels.find((r) => r.id === selectedReelId) || enrichedReels[0] || DEFAULT_REELS[0],
        [enrichedReels, selectedReelId]
      );

      const contentGraphData = useMemo(() => {
        const baseList = enrichedReels.length > 0 ? [...enrichedReels].reverse() : DEFAULT_REELS;
        const activeReels =
          baseList.length === 1
            ? [
                { ...baseList[0], title: 'Launch Day 1', reach: Math.round(baseList[0].reach * 0.22), watchHours: +(baseList[0].watchHours * 0.22).toFixed(1) },
                { ...baseList[0], title: '48h Hook Surge', reach: Math.round(baseList[0].reach * 0.58), watchHours: +(baseList[0].watchHours * 0.58).toFixed(1) },
                { ...baseList[0], title: 'Explore Push', reach: Math.round(baseList[0].reach * 0.84), watchHours: +(baseList[0].watchHours * 0.84).toFixed(1) },
                { ...baseList[0], title: 'Current Total' }
              ]
            : baseList;

        const maxReach = Math.max(...activeReels.map((r) => r.reach), 500);
        const maxWatch = Math.max(...activeReels.map((r) => r.watchHours), 5);
        const series = activeReels.map((r, i) => ({
          index: i,
          title: r.title,
          reach: r.reach,
          watchHours: r.watchHours,
          reachNorm: Math.round((r.reach / maxReach) * 100),
          watchNorm: Math.round((r.watchHours / maxWatch) * 100)
        }));

        const toPoints = (key) =>
          series.map((pt, i) => `${(series.length === 1 ? 350 : (i * 660) / (series.length - 1) + 20).toFixed(1)},${Math.max(18, Math.min(168, 170 - pt[key] * 1.42)).toFixed(1)}`).join(' ');

        return { series, reachPoints: toPoints('reachNorm'), watchPoints: toPoints('watchNorm') };
      }, [enrichedReels]);

      const handleThumbnailChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 96;
          canvas.height = 96;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 96, 96);
          const d = ctx.getImageData(0, 0, 96, 96).data;
          let sum = 0, sq = 0;
          for (let i = 0; i < d.length; i += 4) {
            const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
            sum += l;
            sq += l * l;
          }
          const mean = sum / (d.length / 4);
          const sd = Math.sqrt(sq / (d.length / 4) - mean * mean);
          setImageSignal({ width: img.width, height: img.height, brightness: Math.round((mean / 255) * 100), contrast: Math.round(sd), fileName: file.name });
          setPreviewUrl(url);
          showToast(`Cover photo "${file.name}" analyzed (${img.width}×${img.height}).`);
        };
        img.src = url;
      };

      const handleDriveOrReelUrlChange = (val, isSample = false) => {
        setDriveUrl(val);
        if (!val.trim()) {
          setLabFormat('—');
          setDurationSec(0);
          setPredictionResult(null);
          return;
        }
        const driveId = extractDriveFileId(val);
        const igId = extractInstagramReelId(val);
        setLabFormat(/\/p\//i.test(val) && !/reel/i.test(val) ? 'Carousel' : 'Reel');
        const token = driveId || igId || val;
        const h = Math.abs(token.split('').reduce((a, c, i) => a + c.charCodeAt(0) * (i + 17), 0));
        setDurationSec(16 + (h % 26));
        if (isSample) {
          setReelTopic('The 10-minute creative reset · High-retention cut pattern');
          setCaption('Stop losing 60% of your viewers in the first 3 seconds. Here is the exact visual cut pattern that reached 2,450 people from 100 followers — save this checklist!');
          setHashtags('#reelsgrowth #videoediting #creatortips #retentionrate');
        }
      };

      const handlePredictVirality = (e) => {
        e.preventDefault();
        if (!driveUrl.trim() && !previewUrl) return showToast('Paste a Google Drive or Instagram Reel link first.');
        if (!caption.trim()) return showToast('Enter your Reel caption first.');

        const driveId = extractDriveFileId(driveUrl);
        const igId = extractInstagramReelId(driveUrl);
        const words = caption.toLowerCase().match(/[a-z0-9]+/g) || [];
        const hasCTA = /save|share|comment|send|follow|checklist|template/i.test(caption);
        const hasNumbers = /\d+/.test(caption);
        const coverBonus = imageSignal ? (imageSignal.brightness >= 32 && imageSignal.contrast >= 36 ? 7 : 3) : 0;
        const hookScore = hookStyle === '1.15' ? 26 : hookStyle === '1.05' ? 21 : 14;
        const paceScore = cutPace === 'fast_2s' ? 22 : cutPace === 'dynamic_4s' ? 16 : 10;
        const copyScore = Math.min(25, 8 + (words.length > 10 ? 6 : 2) + (hasCTA ? 7 : 0) + (hasNumbers ? 4 : 0));
        const audioScore = audioType === 'trending_original' ? 10 : audioType === 'trending_music' ? 7 : 4;
        const score = Math.min(98, Math.max(25, hookScore + paceScore + copyScore + audioScore + coverBonus + (driveId || igId ? 6 : 2)));

        const activeFollowers = Math.max(1, Number(labFollowers) || 100);
        const reach = Math.round(activeFollowers * (score >= 82 ? 24.5 : score >= 68 ? 13.2 : 5.1));
        const predictedPlays = Math.round(reach * 1.27);
        const dur = durationSec || 24;
        const predictedHookHold3s = +(70 + score * 0.24).toFixed(1);
        const predictedRetention = +(predictedHookHold3s * 0.89).toFixed(1);
        const predictedCompletion = +(predictedRetention * 0.82).toFixed(1);
        const avgWatchSeconds = +((dur * predictedRetention) / 100).toFixed(1);
        const predictedWatchHours = +((predictedPlays * avgWatchSeconds) / 3600).toFixed(1);

        setPredictionResult({
          reelTopic: reelTopic || caption.slice(0, 44),
          caption,
          format: 'Reel',
          driveUrl,
          score,
          reach,
          predictedPlays,
          predictedWatchHours,
          predictedRetention,
          predictedHookHold3s,
          predictedCompletion,
          durationSec: dur,
          engagement: +(5.6 + score * 0.04).toFixed(1),
          predictedFollowersGained: Math.max(2, Math.round(reach * 0.011)),
          curve: [100, Math.round(predictedHookHold3s), 88, 85, 82, 79, 76, 74, 72, 70, 69, Math.round(predictedCompletion)]
        });
        showToast(`Virality Score: ${score}/100 · Est. Reach ${reach.toLocaleString()}`);
      };

      const handlePushPredictionToContentGraph = () => {
        if (!predictionResult) return;
        const newReel = {
          id: 'reel-' + Date.now(),
          title: predictionResult.reelTopic,
          format: 'Reel',
          reach: predictionResult.reach,
          plays: predictionResult.predictedPlays,
          durationSec: predictionResult.durationSec,
          avgWatchSec: +((predictionResult.durationSec * predictionResult.predictedRetention) / 100).toFixed(1),
          retentionRate: predictionResult.predictedRetention,
          hookHold3s: predictionResult.predictedHookHold3s,
          completionRate: predictionResult.predictedCompletion,
          engagement: predictionResult.engagement,
          saves: Math.round(predictionResult.reach * 0.045),
          followersGained: predictionResult.predictedFollowersGained,
          driveLink: predictionResult.driveUrl,
          color: 'var(--yellow)',
          letter: 'AI',
          curve: predictionResult.curve
        };
        setReels((prev) => [newReel, ...prev]);
        setSelectedReelId(newReel.id);
        setPage('overview');
        showToast(`"${newReel.title}" added to Content Graph!`);
      };

      const handleAddReelViaLink = (e) => {
        e.preventDefault();
        if (!newReelLink.trim()) return;
        const driveId = extractDriveFileId(newReelLink);
        const igId = extractInstagramReelId(newReelLink);
        const token = driveId || igId || newReelLink;
        const h = Math.abs(token.split('').reduce((a, c, i) => a + c.charCodeAt(0) * (i + 19), 0));
        const reach = Math.round((Number(igAccount.followers) || 100) * (12 + (h % 16)));
        const plays = Math.round(reach * 1.25);
        const dur = 18 + (h % 20);
        const hookHold = +(82 + (h % 12)).toFixed(1);
        const retention = +(hookHold * 0.88).toFixed(1);
        const completion = +(retention * 0.81).toFixed(1);
        const newReel = {
          id: 'reel-' + Date.now(),
          title: `Reel [${(driveId || igId || 'Stream').slice(0, 8)}]`,
          format: 'Reel',
          reach,
          plays,
          durationSec: dur,
          avgWatchSec: +((dur * retention) / 100).toFixed(1),
          retentionRate: retention,
          hookHold3s: hookHold,
          completionRate: completion,
          engagement: +(6.8 + (h % 35) / 10).toFixed(1),
          saves: Math.round(reach * 0.04),
          followersGained: Math.max(3, Math.round(reach * 0.01)),
          driveLink: newReelLink.trim(),
          color: 'var(--blue)',
          letter: 'R',
          curve: [100, Math.round(hookHold), 85, 82, 79, 76, 73, 71, 69, 67, 65, Math.round(completion)]
        };
        setReels((prev) => [newReel, ...prev]);
        setSelectedReelId(newReel.id);
        setNewReelLink('');
        setShowAddReelModal(false);
        showToast(`Added ${newReel.title} to Content Graph!`);
      };

      const sortedReels = useMemo(() => {
        return enrichedReels
          .filter((p) => postFilter === 'All formats' || p.format === postFilter)
          .sort((a, b) => {
            const valA = a[sortKey];
            const valB = b[sortKey];
            const cmp = typeof valA === 'number' ? valA - valB : String(valA).localeCompare(String(valB));
            return cmp * (ascending ? 1 : -1);
          });
      }, [enrichedReels, postFilter, sortKey, ascending]);

      const parsedDriveId = extractDriveFileId(driveUrl);
      const parsedIgReelId = extractInstagramReelId(driveUrl);

      return (
        <div style={{ margin: 0, background: '#f5f3ec', color: '#20221e', font: "14px 'DM Sans', sans-serif", minHeight: '100vh' }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');
            :root { --ink:#20221e; --paper:#f5f3ec; --yellow:#e8ed83; --blue:#cadde9; --coral:#f4b19e; --purple:#d8cae9; --mint:#c9dcc7; }
            * { box-sizing: border-box; }
            button, input, textarea, select { font: inherit; color: inherit; }
            button { border: 1px solid var(--ink); background: transparent; padding: 10px 17px; border-radius: 7px; cursor: pointer; }
            button:hover { background: var(--ink); color: var(--paper); }
            .primary { background: var(--ink); color: var(--paper); }
            aside { width: 218px; position: fixed; inset: 0 auto 0 0; padding: 32px 22px; border-right: 1px solid #cdcec4; display: flex; flex-direction: column; background: var(--paper); z-index: 10; }
            .logo { font-size: 30px; letter-spacing: -2px; font-weight: 700; }

      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
